version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ginhawa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  # Kiosk Backend (Edge)
  kiosk-backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./apps/kiosk-backend:/app
      - ./packages:/packages
    environment:
      PYTHONPATH: /app:/packages
      DATABASE_URL: sqlite:///./ginhawa_kiosk.db
      CLOUD_API_URL: http://cloud-backend:8001/api/sync
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install fastapi uvicorn sqlalchemy requests schedule websockets pydantic &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # Cloud Backend (Server)
  cloud-backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./apps/cloud-backend:/app
      - ./packages:/packages
    environment:
      PYTHONPATH: /app:/packages
      DATABASE_URL: postgresql://user:password@db:5432/ginhawa
    depends_on:
      - db
    ports:
      - "8001:8001"
    command: >
      sh -c "pip install fastapi uvicorn sqlalchemy requests psycopg2-binary pydantic &&
             uvicorn main:app --host 0.0.0.0 --port 8001 --reload"

volumes:
  postgres_data:
